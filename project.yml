name: MarkdownTextTool
options:
  minimumXcodeGenVersion: 2.42.0
  projectFormat: xcode16_0
  xcodeVersion: "16.4"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  MarkdownCore:
    path: .
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
fileGroups:
  - Config
  - scripts
  - Package.swift
targetTemplates:
  MarkdownApp:
    type: application
    sources:
      - path: Shared
    dependencies:
      - package: MarkdownCore
        product: MarkdownCore
      - package: MarkdownUI
        product: MarkdownUI
    settings:
      base:
        PRODUCT_NAME: MarkdownTextTool
        PRODUCT_MODULE_NAME: MarkdownTextTool
        APP_BUNDLE_IDENTIFIER: com.example.MarkdownTextTool
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
targets:
  MarkdownTextTool-iOS:
    templates: [MarkdownApp]
    platform: iOS
    deploymentTarget: "15.0"
    settings:
      base:
        INFOPLIST_FILE: Config/iOS-Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  MarkdownTextTool-macOS:
    templates: [MarkdownApp]
    platform: macOS
    deploymentTarget: "12.0"
    settings:
      base:
        INFOPLIST_FILE: Config/macOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
schemes:
  MarkdownTextTool-iOS:
    build:
      targets:
        MarkdownTextTool-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  MarkdownTextTool-macOS:
    build:
      targets:
        MarkdownTextTool-macOS: all
    run:
      config: Debug
    archive:
      config: Release
